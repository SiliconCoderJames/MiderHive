name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 最小权限：CI 只需要读代码。build/test 用不到任何写操作,
# 泄漏的 GITHUB_TOKEN 也做不了事。
permissions:
  contents: read

# 同一分支/PR 的新推送取消还在跑的旧构建：省排队时间,结论永远以最新提交为准
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: Build + Unit Tests + Integration (Windows, Qt6)
    runs-on: windows-latest
    # Qt 安装 + 全量构建 + 单测 + 两轮集成检查；60 分钟富余,卡死早失败早发现
    timeout-minutes: 60
    steps:
      # 第三方 action 一律钉全量 commit SHA（SHA 经 git ls-remote 向官方仓库查证）,
      # 标签可被移动而 SHA 不可变,防供应链投毒;注释里保留人可读的版本号
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout 的 GITHUB_TOKEN 仅 checkout 需要,不留在 runner 磁盘上
          persist-credentials: false

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          # windows-latest 不再保证预装 VS 2022：运行时探测可用的最新 VS 生成器
          # （cmake --help 按新→旧排列，取第一个即最新）
          $gen = (cmake --help | Select-String 'Visual Studio \d+ 20\d\d' |
            Select-Object -First 1).Matches[0].Value
          if (-not $gen) { throw 'no Visual Studio generator detected on runner' }
          Write-Host "using generator: $gen"
          cmake -S . -B build -G "$gen" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build (core + cli + mcp + gui)
        run: cmake --build build --config Release

      # Qt6 是 QUIET 查找、缺失时只 WARNING 并跳过 GUI 目标，构建仍然会"成功"。
      # 这里显式断言 GUI 真的产出了，否则 CI 全绿但工作台其实没编出来。
      - name: Assert the GUI was actually built
        shell: pwsh
        run: |
          $exe = "build\src\gui\Release\miderhive.exe"
          if (-not (Test-Path $exe)) { throw "GUI target missing: $exe (Qt6 not found?)" }
          $cli = @("build\src\cli\Release\agent-cli.exe", "build\src\cli\Release\platformd.exe",
                   "build\src\cli\Release\miderhive-mcp.exe")
          foreach ($c in $cli) { if (-not (Test-Path $c)) { throw "CLI target missing: $c" } }
          Write-Host "build outputs verified"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Integration feasibility check (44 assertions)
        shell: pwsh
        env:
          MIDERHIVE_MASTER_KEY: ci-test-master-key-not-a-secret
        run: |
          $dataHome = Join-Path $env:RUNNER_TEMP "miderhive-data"
          New-Item -ItemType Directory -Force -Path $dataHome | Out-Null
          $env:MIDERHIVE_HOME = $dataHome
          $env:MIDERHIVE_PORT = "19090"
          $p = Start-Process -FilePath "build\src\cli\Release\platformd.exe" -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..30) {
              try {
                Invoke-RestMethod "http://127.0.0.1:19090/api/health" | Out-Null
                $ready = $true; break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "platformd did not become healthy in 30s" }
            # bootstrap 预置的 zcode 管理者密钥在数据目录 config/agents.json
            $agents = Get-Content (Join-Path $dataHome "config\agents.json") | ConvertFrom-Json
            $env:MIDERHIVE_ZCODE_KEY = $agents.zcode
            python scripts/feasibility_check.py 19090
            if ($LASTEXITCODE -ne 0) { throw "feasibility check failed" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # MCP 服务器是 agent 接入的新通道,协议适配层(JSON-RPC 分帧/工具转发/鉴权)
      # 单测覆盖不到,必须像 feasibility check 一样跑真进程
      - name: MCP server check (stdio JSON-RPC)
        shell: pwsh
        env:
          MIDERHIVE_MASTER_KEY: ci-test-master-key-not-a-secret
        run: |
          $dataHome = Join-Path $env:RUNNER_TEMP "miderhive-mcp-data"
          New-Item -ItemType Directory -Force -Path $dataHome | Out-Null
          $env:MIDERHIVE_HOME = $dataHome
          $env:MIDERHIVE_PORT = "19091"
          $p = Start-Process -FilePath "build\src\cli\Release\platformd.exe" -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..30) {
              try {
                Invoke-RestMethod "http://127.0.0.1:19091/api/health" | Out-Null
                $ready = $true; break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "platformd did not become healthy in 30s" }
            $key = (Get-Content (Join-Path $dataHome "config\agents.json") | ConvertFrom-Json).zcode
            python scripts/mcp_check.py 19091 "build\src\cli\Release\miderhive-mcp.exe" zcode $key
            if ($LASTEXITCODE -ne 0) { throw "MCP check failed" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # 1.1.1 的招牌能力（首次接入引导、密钥丢失横幅、一键轮换）在 GUI 层，feasibility 与 MCP
      # 两条链路都覆盖不到。这两条脚本此前只在发版前本地跑：招牌功能真回归了 CI 也不会红，
      # 等于没有防线。gui_selftest 跑的是真实 MainWindow/WelcomeDialog（不是另写的复刻流程），
      # 以 offscreen 无头方式驱动，无需人工点击。
      - name: GUI end-to-end self-test (offscreen)
        shell: pwsh
        run: |
          python scripts/verify_gui_selftest.py --build build
          if ($LASTEXITCODE -ne 0) {
            throw "GUI self-test failed - onboarding / health banner / key rotation regressed"
          }

      # 同一条主线的后端口径：预配身份、心跳上线、欢迎记忆、密钥缓存丢失诊断、轮换后旧钥立即失效
      - name: Onboarding and key-rotation self-test
        shell: pwsh
        env:
          MH_PLATFORMD: build\src\cli\Release\platformd.exe
          MH_PORT: "19092"
        run: |
          python scripts/test_onboarding_and_safety.py
          if ($LASTEXITCODE -ne 0) { throw "onboarding/key-rotation self-test failed" }

      # 下面三条此前同样只在本地手动跑，等于"有测试、没防线"。fuzz 那次真抓出两个会写坏
      # 用户配置文件的 bug（tab 缩进与块标量 `key: |` 未被拒绝），却因为没人自动跑而差点漏掉。
      # 三条都是离线的（不需要运行中的平台），能在一台干净的 runner 上直接跑。
      - name: Config merge fuzz test (adversarial user configs)
        shell: pwsh
        run: |
          python scripts/fuzz_config_merge.py --agent-cli build\src\cli\Release\agent-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "config merge fuzz test failed - apply-config may corrupt user configs" }

      # 未安装的客户端记 SKIP 而不是失败（脚本内部如此判定），所以干净 runner 上依然有效：
      # codex/hermes 的配置形状是离线校验的，只有 claude/dsh 需要本机真的装了才深验。
      - name: Per-client connect matrix
        shell: pwsh
        run: |
          python scripts/verify_clients.py --agent-cli build\src\cli\Release\agent-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "client connect matrix failed - a generated config no longer parses" }

      # 外接嵌入端点闭环：脚本自带 mock 的 OpenAI 兼容端点与自己的 platformd，不碰外部网络
      - name: External embedding endpoint round-trip
        shell: pwsh
        run: |
          python scripts/embed_cli_check.py --agent-cli build\src\cli\Release\agent-cli.exe --platformd build\src\cli\Release\platformd.exe
          if ($LASTEXITCODE -ne 0) { throw "external embedding round-trip failed - real-semantic path regressed" }
