name: Release

# 推 v* 标签即出包；也可在 Actions 页面手动触发并指定版本号。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，可带 v 前缀）'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # 创建 Release 并上传资产

# 同一 tag 只允许一条发布流水线;绝不取消进行中的发布
#（cancel-in-progress: false——发布到一半被取消会留下半成品 Release）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build + package + publish (Windows x64)
    runs-on: windows-latest
    # Qt 安装 + 全量构建 + 单测 + 打包(MSI/ICE 校验/ZIP) + 发布;90 分钟富余
    timeout-minutes: 90

    steps:
      # 第三方 action 钉全量 commit SHA（经 git ls-remote 向官方仓库查证）,防供应链投毒
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发布用 gh CLI + 显式 GH_TOKEN,不需要 checkout 留存的凭据
          persist-credentials: false

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'cannot resolve version' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "release version: $v"

      - name: Package (build, stage, self-check, MSI + ICE, ZIP, checksums)
        shell: pwsh
        run: |
          # windows-latest 不再保证预装 VS 2022：运行时探测可用的最新 VS 生成器
          # （cmake --help 按新→旧排列，取第一个即最新）
          $gen = (cmake --help | Select-String 'Visual Studio \d+ 20\d\d' |
            Select-Object -First 1).Matches[0].Value
          if (-not $gen) { throw 'no Visual Studio generator detected on runner' }
          Write-Host "using generator: $gen"
          # -QtPrefix 指向 install-qt-action 安装的 Qt
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -QtPrefix "$env:QT_ROOT_DIR" `
            -Generator "$gen"

      - name: Unit tests
        shell: pwsh
        run: |
          ctest --test-dir build/full -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed - not publishing" }

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MiderHive-windows-x64
          path: |
            release/*.msi
            release/*.zip
            release/SHA256SUMS.txt
            release/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 产物文件名由 package.ps1 用"纯数字版本"命名（-rc1 之类后缀不进文件名），
          # 这里必须切到同一种形式去找文件；tag 与预发布判定则用原始版本串。
          $verRaw = "${{ steps.ver.outputs.version }}" -replace '^v', ''
          if ($verRaw -notmatch '^([0-9]+\.[0-9]+\.[0-9]+)') { throw "unexpected version: $verRaw" }
          $ver = $Matches[1]
          $tag = "${{ steps.ver.outputs.version }}"
          if (-not ($tag -match '^v')) { $tag = "v$verRaw" }
          $msi = "release/MiderHive-$ver-x64.msi"
          $zip = "release/MiderHive-$ver-win64-portable.zip"
          $sums = "release/SHA256SUMS.txt"
          # latest.json is what the in-app updater fetches
          # (https://github.com/<repo>/releases/latest/download/latest.json) - it must be
          # published with every release or auto-update stops working.
          $manifest = "release/latest.json"
          foreach ($f in @($msi, $zip, $sums, $manifest)) {
            if (-not (Test-Path $f)) { throw "missing artifact: $f" }
          }
          # Release notes live in the repo so a manual release and a CI release show the same
          # text: release/RELEASE_NOTES-<ver>.md (fallback below when the file is absent).
          $notesFile = "release/RELEASE_NOTES-$ver.md"
          if (Test-Path $notesFile) {
            $notes = Get-Content $notesFile -Raw
            Write-Host "using release notes from $notesFile"
          } else {
            $notes = @"
          ## MiderHive $ver

          Local-first collaboration hub for AI agents, Windows x64 build.

          * ``MiderHive-$ver-x64.msi`` - per-user install (no administrator rights)
          * ``MiderHive-$ver-win64-portable.zip`` - unzip and run ``miderhive.exe``
          * ``SHA256SUMS.txt`` - checksums

          The binaries are **not code-signed**, so SmartScreen may warn on first launch.
          Your data lives in ``%USERPROFILE%\.miderhive`` and is **not** removed on uninstall.

          See ``release/RELEASE_NOTES-$ver.md`` for the full notes.
          "@
          }
          # 版本串含 '-'（如 v1.0.1-rc1）时按预发布发布（用原始串判断,纯数字 $ver 已无后缀）
          $pre = @()
          if ($verRaw -match '-') { $pre = @('--prerelease') }

          # 已存在同标签的 Release 时直接补充资产，避免重复创建失败
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $msi $zip $sums $manifest --clobber
            gh release edit $tag --notes $notes @pre
          } else {
            # --target 让新建的标签指向本次实际构建的 commit（workflow_dispatch 手动触发时
            # 标签还不存在，不加会把标签打到默认分支头上，产物与 commit 对不上）
            gh release create $tag $msi $zip $sums $manifest `
              --title "MiderHive $ver" --notes $notes --target $env:GITHUB_SHA @pre
          }
